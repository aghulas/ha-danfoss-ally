[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Bibliothèque réutilisable extraite de l'intégration (voie 1a Danfoss Ally).
# Source UNIQUE : le dossier custom_components/danfoss_ally_cloud/api (que l'intégration « vend »
# pour le runtime HACS). Packagée ici sous le nom pydanfoss_cloud, sans déplacer les fichiers :
# le connecteur MCP pourra en dépendre (pip install pydanfoss-cloud) une fois publiée sur PyPI,
# et l'intégration continuera de la vendre tant que la publication n'est pas faite.
[project]
name = "pydanfoss-cloud"
version = "0.2.0"
description = "Accès à l'API cloud non officielle Danfoss Ally (voie 1a) : client, décodage DP, écritures gardées, clés passerelles, tunnel Zigbee local."
readme = "custom_components/danfoss_ally_cloud/api/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aghulas" }]
keywords = ["danfoss", "ally", "thermostat", "zigbee", "tuya", "home-assistant", "heating"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = ["pycryptodome>=3.20", "requests>=2.31"]

[project.optional-dependencies]
local = ["tinytuya>=1.15"]

[project.urls]
Homepage = "https://github.com/aghulas/ha-danfoss-ally"
Repository = "https://github.com/aghulas/ha-danfoss-ally"
Issues = "https://github.com/aghulas/ha-danfoss-ally/issues"

[tool.setuptools]
packages = ["pydanfoss_cloud", "pydanfoss_cloud._tuya", "pydanfoss_cloud.local"]

[tool.setuptools.package-dir]
pydanfoss_cloud = "custom_components/danfoss_ally_cloud/api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "FURB"]

[tool.mypy]
python_version = "3.14"  # type-check against the HA runtime (2026.x)
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

# Paquets sans stubs exploitables hors du setup mypy de Home Assistant core : on vérifie NOTRE
# code, pas ces dépendances (homeassistant, voluptuous, pycryptodome, tinytuya, requests).
[[tool.mypy.overrides]]
module = [
  "homeassistant.*",
  "voluptuous",
  "voluptuous.*",
  "Crypto.*",
  "tinytuya",
  "paho",
  "paho.*",
  "certifi",
  "requests",
  "requests.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=custom_components/danfoss_ally_cloud --cov-report=term-missing --cov-fail-under=93"
pythonpath = "."
