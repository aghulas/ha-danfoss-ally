name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # « brands » exige des assets dans home-assistant/brands (PR séparée, à faire avant
          # l'inclusion au Marketplace). Ignoré tant que cette PR n'est pas mergée.
          ignore: brands
