name: Frontend
on: [push, pull_request]

# Rebuilds the versioned bundle of the embedded frontend DETERMINISTICALLY and
# fails if the committed file
# (custom_components/danfoss_ally_cloud/frontend/danfoss-ally-cloud.js) is out of
# date. Determinism: pinned Node (.nvmrc), pinned dependencies (npm ci on
# package-lock.json), non-minified output. Rollup/esbuild output depends on the
# tool versions (locked), not on the Node version or the platform.
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # EXACT build command (see frontend/README). Output goes to
      # custom_components/danfoss_ally_cloud/frontend/danfoss-ally-cloud.js.
      - run: npm run build
      - name: Check that the versioned bundle is up to date
        run: |
          if ! git diff --quiet -- ../custom_components/danfoss_ally_cloud/frontend/danfoss-ally-cloud.js; then
            echo "::error::The versioned bundle is out of date. Run 'npm --prefix frontend ci && npm --prefix frontend run build' then commit the file."
            git --no-pager diff -- ../custom_components/danfoss_ally_cloud/frontend/danfoss-ally-cloud.js | head -50
            exit 1
          fi
