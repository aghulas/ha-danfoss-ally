name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/danfoss_ally_cloud
      - run: pytest  # coverage + threshold via pyproject (addopts)
      # Validates the extraction of the pydanfoss-cloud library (installable package, without HA).
      - run: pip install -e '.[local]'
      - run: python -c "import pydanfoss_cloud; from pydanfoss_cloud import CloudClient, decode_device; from pydanfoss_cloud.local import tunnel"
      # Runtime dependency audit.
      - run: pip-audit -r requirements.txt
