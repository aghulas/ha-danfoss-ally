get_rooms:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

get_room:
  fields:
    target:
      required: true
      example: '{"type": "room", "id": "<group_id>"}'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

create_room:
  fields:
    name:
      required: true
      example: Classroom 1
      selector:
        text:
    devices:
      required: true
      example: '["<devId1>", "<devId2>"]'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

rename_room:
  fields:
    target:
      required: true
      example: '{"type": "room", "id": "<group_id>"}'
      selector:
        object:
    name:
      required: true
      example: Classroom 1
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

delete_room:
  fields:
    target:
      required: true
      example: '{"type": "room", "id": "<group_id>"}'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

attach_heads:
  fields:
    target:
      required: true
      example: '{"type": "room", "id": "<group_id>"}'
      selector:
        object:
    devices:
      required: true
      example: '["<devId>"]'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

detach_heads:
  fields:
    target:
      required: true
      example: '{"type": "room", "id": "<group_id>"}'
      selector:
        object:
    devices:
      required: true
      example: '["<devId>"]'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

get_local_survey:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

set_descaling:
  fields:
    target:
      required: true
      example: '{"type": "device", "id": "<devId>"}'
      selector:
        object:
    day:
      required: true
      example: wed
      selector:
        select:
          options: [mon, tue, wed, thu, fri, sat, sun]
    time:
      required: true
      example: "13:00"
      selector:
        time:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

set_override:
  fields:
    target:
      required: true
      example: '{"type": "device", "id": "<devId>"}'
      selector:
        object:
    temperature:
      required: true
      example: 20
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

clear_override:
  fields:
    target:
      required: true
      example: '{"type": "device", "id": "<devId>"}'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

set_window_detection:
  fields:
    target:
      required: true
      example: '{"type": "device", "id": "<devId>"}'
      selector:
        object:
    enabled:
      required: true
      example: true
      selector:
        boolean:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

get_schedule:
  fields:
    target:
      required: true
      example: '{"type": "room", "id": "13000000"}'
      selector:
        object:
    refresh:
      required: false
      default: false
      selector:
        boolean:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

set_schedule:
  fields:
    target:
      required: true
      example: '{"type": "room", "id": "13000000"}'
      selector:
        object:
    days:
      required: true
      example: '{"mon": [{"start": "08:30", "end": "17:30"}], "sat": []}'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

copy_schedule:
  fields:
    source:
      required: true
      example: '{"type": "room", "id": "13000000"}'
      selector:
        object:
    targets:
      required: true
      example: '[{"type": "room", "id": "13000001"}]'
      selector:
        object:
    days:
      required: false
      example: '["mon", "tue"]'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

restore_schedule:
  fields:
    target:
      required: true
      example: '{"type": "room", "id": "13000000"}'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud

get_write_job:
  fields:
    job_id:
      required: true
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: danfoss_ally_cloud
