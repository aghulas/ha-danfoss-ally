name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # HA 2026.x requires 3.14 (matches the pytest-HA pin)
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/danfoss_ally_cloud
      - run: pytest  # coverage + threshold via pyproject (addopts)
      # Validates the extraction of the pydanfoss-cloud library (installable package, without HA).
      # Built as a wheel and installed into a clean venv, so a module missing from the package or a
      # dependency missing from an extra fails here rather than at the consumer's.
      - run: pip install build && python -m build --wheel
      - run: python -m venv /tmp/lib && /tmp/lib/bin/pip install "$(ls dist/pydanfoss_cloud-*.whl)[local,mqtt]"
      - run: cd /tmp && /tmp/lib/bin/python -c "import pydanfoss_cloud; from pydanfoss_cloud import CloudClient, decode_device, mqtt_publish, mqtt_client; from pydanfoss_cloud.local import tunnel; import paho.mqtt.client"
      # Runtime dependency audit.
      - run: pip-audit -r requirements.txt

  # Floor check: the same tests on the oldest HA line our harness can still install (Python 3.12 ->
  # HA 2025.1.x). Catches code that only works on recent HA (e.g. a dependency pin or an API that
  # changed), since hacs.json still declares an older minimum. Not a required check.
  test-ha-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -c "import homeassistant.const as c; print('HA', c.__version__)"
      - run: pytest
